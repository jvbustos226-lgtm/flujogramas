<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Flujogramas interactivos | Operación comercial</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1b1b;
      --muted: #666666;
      --line: #dedede;
      --paper: #ffffff;
      --canvas: #f5f5f5;
      --navy: #111111;
      --blue: #bd101b;
      --teal: #bd101b;
      --gold: #bd101b;
      --red: #bd101b;
      --soft-blue: #fae9ea;
      --soft-teal: #fae9ea;
      --soft-gold: #fff1f1;
      --soft-red: #fae9ea;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--canvas);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1120px; padding: 30px 24px 52px; margin: 0 auto; }
    .brandbar { display: flex; align-items: center; gap: 22px; min-height: 112px; padding: 8px 22px; border-radius: 12px; background: #080808; }
    .brand-logo { display: block; width: min(220px, 45vw); height: auto; }
    .brand-divider { width: 1px; height: 54px; background: #444; }
    .brand-caption { color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .14em; line-height: 1.6; text-transform: uppercase; }
    .brand-caption span { display: block; color: #f12a32; }
    .topline { display: flex; align-items: center; gap: 10px; margin-top: 25px; color: var(--teal); font-size: 12px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .topline::before { content: ""; width: 24px; height: 2px; background: currentColor; }
    h1 { margin: 12px 0 8px; max-width: 760px; color: var(--navy); font-family: Georgia, "Times New Roman", serif; font-size: clamp(30px, 4.5vw, 48px); font-weight: 500; letter-spacing: -.035em; line-height: 1.08; }
    .intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(230px, .9fr); gap: 14px; margin: 28px 0 18px; }
    .field-label { display: block; margin: 0 0 7px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .045em; }
    select { width: 100%; min-height: 46px; padding: 0 40px 0 14px; border: 1px solid #ccd7de; border-radius: 9px; color: var(--ink); background: var(--paper); }
    select:focus-visible, button:focus-visible { outline: 3px solid #66b9c1; outline-offset: 2px; }
    .sector-tabs { display: flex; gap: 7px; overflow-x: auto; padding: 3px 2px 10px; scrollbar-width: thin; }
    .sector-tab { flex: 0 0 auto; padding: 9px 13px; border: 1px solid transparent; border-radius: 7px; color: #526879; background: transparent; font-size: 13px; font-weight: 650; }
    .sector-tab:hover { background: #ededed; }
    .sector-tab[aria-pressed="true"] { border-color: #e2b5b8; color: var(--navy); background: #fff; box-shadow: inset 0 -2px 0 #bd101b, 0 2px 7px #0000000b; }
    .main-card { overflow: hidden; border: 1px solid #dce4e9; border-radius: 14px; background: var(--paper); box-shadow: 0 12px 34px #24435a0b; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 23px 26px 18px; border-bottom: 1px solid #e8edf0; }
    .eyebrow { margin: 0 0 6px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h2 { margin: 0; color: var(--navy); font-size: clamp(21px, 3vw, 26px); font-weight: 700; letter-spacing: -.025em; }
    .counter { flex: 0 0 auto; padding: 7px 10px; border-radius: 999px; color: #506677; background: #f0f4f6; font-size: 12px; font-weight: 700; }
    .canvas { padding: 26px; }
    .flowmap { display: flex; flex-direction: column; align-items: center; }
    .flow-sequence { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .node { display: flex; align-items: center; justify-content: center; min-height: 46px; width: min(100%, 390px); padding: 10px 16px; border: 1px solid #d6d6d6; border-radius: 9px; color: #292929; background: #fff; text-align: center; font-size: 14px; line-height: 1.35; transition: background .2s, border-color .2s, box-shadow .2s, transform .2s; }
    .node.terminal { width: 142px; min-height: 40px; border: 0; border-radius: 999px; color: #fff; background: var(--navy); font-weight: 750; }
    .node.process { background: #fff; }
    .node.decision { width: min(100%, 330px); min-height: 62px; border-color: #e4a3a7; border-radius: 12px; color: #8c0b13; background: var(--soft-gold); font-weight: 750; }
    .node.is-current { border-color: var(--teal); background: #fff0f0; box-shadow: 0 0 0 3px #bd101b20; transform: translateY(-1px); }
    .node.terminal.is-current { background: #bd101b; }
    .connector { display: flex; align-items: center; justify-content: center; height: 28px; color: #777; font-size: 20px; line-height: 1; }
    .branch-label { margin: 0 0 9px; color: #657988; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .branch-area { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: min(100%, 760px); margin: 2px 0 8px; }
    .branch { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 14px 12px 12px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fdfdfd; transition: border-color .2s, background .2s, box-shadow .2s; }
    .branch.selected.yes { border-color: #d58a8f; background: #fff9f9; box-shadow: 0 0 0 2px #bd101b17; }
    .branch.selected.no { border-color: #e2b7a7; background: #fff9f7; box-shadow: 0 0 0 2px #b64b4b13; }
    .branch-head { display: flex; align-items: center; gap: 7px; margin: 0 0 12px; color: #333; font-size: 12px; font-weight: 800; }
    .branch-mark { display: inline-grid; width: 23px; height: 23px; place-items: center; border-radius: 50%; color: #fff; background: var(--teal); font-size: 12px; }
    .branch.no .branch-mark { color: var(--red); background: var(--soft-red); }
    .branch .node { width: 100%; min-height: 42px; padding: 8px 10px; font-size: 12px; }
    .branch .node.terminal { width: min(100%, 140px); }
    .branch .connector { height: 23px; }
    .loop-note { display: flex; align-items: flex-start; gap: 8px; width: 100%; margin-top: 10px; padding: 9px 10px; border-radius: 7px; color: #4b171a; background: #fff0f0; font-size: 11px; line-height: 1.45; }
    .loop-note strong { flex: 0 0 auto; color: #bd101b; font-size: 13px; }
    .after { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .decision-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin: 20px 0 0; }
    .route-button, .step-button { min-height: 39px; padding: 8px 14px; border: 1px solid #cdd9df; border-radius: 7px; color: #385264; background: #fff; font-size: 13px; font-weight: 700; }
    .route-button:hover, .step-button:hover { border-color: #91b9c2; background: #f6fafb; }
    .route-button[aria-pressed="true"] { border-color: var(--teal); color: #8c0b13; background: var(--soft-teal); }
    .walkthrough { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 25px; padding-top: 18px; border-top: 1px solid #e8edf0; }
    .walk-copy { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .walk-copy strong { display: block; margin-bottom: 2px; color: var(--ink); font-size: 13px; }
    .walk-actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .step-button.primary { border-color: #bd101b; color: #fff; background: #bd101b; }
    .step-button:disabled { cursor: default; opacity: .45; }
    .live { min-height: 1.4em; margin: 12px 0 0; color: #537080; text-align: center; font-size: 12px; }
    .footnote { margin: 14px 0 0; color: #788a96; font-size: 11px; text-align: center; }
    @media (max-width: 620px) {
      .shell { padding: 22px 14px 34px; }
      .brandbar { gap: 13px; min-height: 84px; padding: 7px 13px; }
      .brand-logo { width: min(175px, 48vw); }
      .brand-divider { height: 42px; }
      .brand-caption { font-size: 10px; }
      .toolbar { grid-template-columns: 1fr; gap: 11px; margin-top: 21px; }
      .card-head { padding: 19px 17px 15px; }
      .canvas { padding: 20px 14px; }
      .branch-area { gap: 8px; }
      .branch { padding: 11px 7px 9px; }
      .branch .node { padding: 8px 6px; font-size: 11px; }
      .branch-head { font-size: 11px; }
      .walkthrough { align-items: flex-start; flex-direction: column; }
      .walk-actions { width: 100%; }
      .walk-actions button { flex: 1; }
    }
    @media (max-width: 380px) { .branch-area { grid-template-columns: 1fr; } }
  </style>
</head>

        { id: 5, title: "Preparación del pedido", before: ["Inicio", "Recibir orden", "Verificar pago", "Localizar repuesto", "Verificar referencia", "Empacar", "Generar documentación", "Entregar a transporte", "Fin"] },
        { id: 6, title: "Despacho y entrega", before: ["Inicio", "Pedido listo", "Asignar transportadora", "Despachar", "Seguimiento"], decision: "¿Pedido entregado?", yes: ["Confirmar entrega", "Actualizar sistema", "Fin"], no: ["Revisar novedad", "Reprogramar entrega", "Volver a seguimiento"], loop: "Si aún no se entrega, el flujo vuelve a Seguimiento y evalúa la entrega de nuevo." }
      ]},
      { id: "servicio", name: "Sector de servicio al cliente", flows: [
        { id: 7, title: "Atención de consultas", before: ["Inicio", "Cliente realiza consulta", "Recibir solicitud", "Identificar necesidad", "Verificar información", "Brindar respuesta"], decision: "¿Cliente requiere otra atención?", yes: ["Continuar asesoría", "Volver a identificar necesidad"], no: ["Cerrar solicitud", "Fin"], loop: "Si requiere otra atención, la asesoría continúa desde Identificar necesidad." },
        { id: 8, title: "Cambios y garantías", before: ["Inicio", "Cliente solicita cambio / garantía", "Recibir producto", "Verificar factura", "Revisar condiciones"], decision: "¿Cumple requisitos?", yes: ["Evaluar producto", "Aprobar cambio / garantía", "Actualizar inventario", "Fin"], no: ["Informar motivo", "Cerrar solicitud", "Fin"] }
      ]},
      { id: "administrativo", name: "Sector administrativo y financiero", flows: [
        { id: 9, title: "Pago y facturación", before: ["Inicio", "Confirmar pedido", "Seleccionar medio de pago", "Procesar pago"], decision: "¿Pago aprobado?", yes: ["Generar factura", "Registrar venta", "Confirmar pedido", "Fin"], no: ["Informar rechazo", "Solicitar otro medio de pago", "Volver a seleccionar medio de pago"], loop: "Si el pago se rechaza, se selecciona otro medio y se procesa nuevamente." },
        { id: 10, title: "Control de ventas", before: ["Inicio", "Recopilar ventas", "Registrar ingresos", "Verificar pagos", "Conciliar ventas", "Registrar gastos", "Calcular resultado", "Analizar información", "Generar informe", "Fin"] }
      ]}
    ];
    const $ = (id) => document.getElementById(id);
    const sectorSelect = $("sector-select"), flowSelect = $("flow-select"), tabs = $("sector-tabs");
    let selectedSector = sectors[0].id, selectedFlow = 1, chosenRoute = "yes", stepIndex = 0;

    function currentSector() { return sectors.find((s) => s.id === selectedSector); }
    function currentFlow() { return currentSector().flows.find((f) => f.id === Number(selectedFlow)); }
    function addOption(select, value, label) { const option = document.createElement("option"); option.value = value; option.textContent = label; select.append(option); }
    function renderSectorControls() {
      sectorSelect.replaceChildren();
      sectors.forEach((sector) => addOption(sectorSelect, sector.id, sector.name));
      sectorSelect.value = selectedSector;
      tabs.replaceChildren();
      sectors.forEach((sector) => {
        const button = document.createElement("button");
        button.type = "button"; button.className = "sector-tab"; button.textContent = sector.name;
        button.setAttribute("aria-pressed", String(sector.id === selectedSector));
        button.addEventListener("click", () => setSector(sector.id));
        tabs.append(button);
      });
      flowSelect.replaceChildren();
      currentSector().flows.forEach((flow) => addOption(flowSelect, flow.id, `Flujograma ${flow.id} · ${flow.title}`));
      flowSelect.value = String(selectedFlow);
    }
    function setSector(id) { selectedSector = id; selectedFlow = currentSector().flows[0].id; chosenRoute = "yes"; stepIndex = 0; render(); }
    function setFlow(id) { selectedFlow = Number(id); chosenRoute = "yes"; stepIndex = 0; render(); }
    function node(label, kind = "process", key = "") {
      const el = document.createElement("div");
      el.className = `node ${kind}`; el.textContent = label;
      if (key) el.dataset.stepKey = key;
      return el;
    }
    function connector(parent) { const el = document.createElement("div"); el.className = "connector"; el.setAttribute("aria-hidden", "true"); el.textContent = "↓"; parent.append(el); }
    function appendSequence(parent, values, prefix) {
      values.forEach((value, i) => { if (i) connector(parent); const kind = /^(inicio|fin)$/i.test(value) ? "terminal" : "process"; parent.append(node(value, kind, `${prefix}-${i}`)); });
    }
    function routeSequence(flow) { return flow.decision ? [...flow.before, flow.decision, ...flow[chosenRoute]] : flow.before; }
    function renderFlow() {
      const flow = currentFlow(), map = $("flowmap"); map.replaceChildren();
      if (!flow.decision) { appendSequence(map, flow.before, "main"); return; }
      const before = document.createElement("div"); before.className = "flow-sequence"; appendSequence(before, flow.before, "before"); map.append(before);
      connector(map);
      map.append(node(flow.decision, "decision", "decision"));
      connector(map);
      const branches = document.createElement("div"); branches.className = "branch-area";
      ["yes", "no"].forEach((route) => {
        const section = document.createElement("section"); section.className = `branch ${route}${chosenRoute === route ? " selected" : ""}`; section.setAttribute("aria-label", route === "yes" ? "Ruta Sí" : "Ruta No");
        const heading = document.createElement("div"); heading.className = "branch-head";
        const mark = document.createElement("span"); mark.className = "branch-mark"; mark.textContent = route === "yes" ? "✓" : "↗";
        heading.append(mark, document.createTextNode(route === "yes" ? "Sí" : "No")); section.append(heading);
        appendSequence(section, flow[route], route);
        if (route === "no" && flow.loop) {
          const loop = document.createElement("div"); loop.className = "loop-note";
          const icon = document.createElement("strong"); icon.textContent = "↶";
          const copy = document.createElement("span"); copy.textContent = flow.loop;
          loop.append(icon, copy); section.append(loop);
        }
        branches.append(section);
      });
      map.append(branches);
    }
    function renderRouteControls() {
      const controls = $("decision-controls"); controls.replaceChildren();
      const flow = currentFlow(); controls.hidden = !flow.decision;
      if (!flow.decision) return;
      [["yes", "Explorar ruta: Sí"], ["no", "Explorar ruta: No"]].forEach(([route, label]) => {
        const button = document.createElement("button"); button.type = "button"; button.className = "route-button"; button.textContent = label;
        button.setAttribute("aria-pressed", String(chosenRoute === route));
        button.addEventListener("click", () => { chosenRoute = route; stepIndex = 0; render(); }); controls.append(button);
      });
    }
    function renderWalkthrough() {
      const flow = currentFlow(), route = routeSequence(flow), total = route.length;
      stepIndex = Math.max(0, Math.min(stepIndex, total - 1));
      document.querySelectorAll("[data-step-key]").forEach((el) => el.classList.remove("is-current"));
      let currentKey;
      if (!flow.decision) currentKey = `main-${stepIndex}`;
      else if (stepIndex < flow.before.length) currentKey = `before-${stepIndex}`;
      else if (stepIndex === flow.before.length) currentKey = "decision";
      else currentKey = `${chosenRoute}-${stepIndex - flow.before.length - 1}`;
      const current = document.querySelector(`[data-step-key="${currentKey}"]`); if (current) current.classList.add("is-current");
      const value = route[stepIndex];
      $("walk-copy").innerHTML = `<strong>Paso ${stepIndex + 1} de ${total}</strong>${value}`;
      $("prev-step").disabled = stepIndex === 0;
      $("next-step").disabled = stepIndex === total - 1;
      $("live-status").textContent = flow.decision ? `Ruta seleccionada: ${chosenRoute === "yes" ? "Sí" : "No"}${flow.loop && chosenRoute === "no" ? " · El retorno se indica en el diagrama." : ""}` : "Recorrido del proceso";
    }
    function render() {
      renderSectorControls();
      const flow = currentFlow();
      $("sector-name").textContent = currentSector().name;
      $("flow-title").textContent = flow.title;
      $("flow-counter").textContent = `Flujograma ${flow.id} de 10`;
      renderFlow(); renderRouteControls(); renderWalkthrough();
    }
    sectorSelect.addEventListener("change", (event) => setSector(event.target.value));
    flowSelect.addEventListener("change", (event) => setFlow(event.target.value));
    $("prev-step").addEventListener("click", () => { stepIndex -= 1; renderWalkthrough(); });
    $("next-step").addEventListener("click", () => { stepIndex += 1; renderWalkthrough(); });
    render();
  </script>
</body>
</html>
